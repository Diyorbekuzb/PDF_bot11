<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 12px; color: #222; padding-bottom: 90px; }
        
        .header { text-align: center; margin-bottom: 15px; }
        .header h3 { font-size: 18px; color: #2c3e50; }

        #pagesContainer { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }

        .page-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 13px; color: #555; }
        
        .image-wrapper { width: 100%; height: 220px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 8px; }
        .image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .tools-bar { display: flex; gap: 6px; margin-bottom: 8px; }
        .tool-btn { background: #f0f2f5; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: #444; flex: 1; text-align: center; }
        .tool-btn.danger { background: #ffebee; color: #d32f2f; }

        .text-input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
        .text-input:focus { border-color: #0088cc; }

        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.08); border-top-left-radius: 16px; border-top-right-radius: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        
        .footer-row { display: flex; gap: 8px; align-items: center; }
        .footer-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
        
        .add-file-btn { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; white-space: nowrap; display: inline-block; }
        .save-pdf-btn { background: #229ed9; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; width: 100%; text-align: center; box-shadow: 0 2px 5px rgba(34,158,217,0.3); cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h3>📄 PDF Tahrirlovchi</h3>
    </div>

    <div id="pagesContainer"></div>

    <!-- Yana rasm yuklash uchun yashirin input -->
    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="uploadNewImage(event)">

    <div class="footer-panel">
        <div class="footer-row">
            <input type="text" id="pdfFileName" value="hujjat.pdf" placeholder="Fayl nomi...">
            <button class="add-file-btn" onclick="document.getElementById('fileInput').click()">+ Rasm Qo'shish</button>
        </div>
        <button class="save-pdf-btn" onclick="submitPdf()">📥 PDF Yaratish va Yuborish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let pages = [];

        function renderPages() {
            const container = document.getElementById('pagesContainer');
            container.innerHTML = '';

            if (pages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding: 30px; background:#fff; border-radius:12px;">Hozircha rasmlar yo\'q.<br><br>Pastdagi <b>"+ Rasm Qo\'shish"</b> tugmasini bosib rasm yuklang!</div>';
                return;
            }

            pages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'page-card';
                card.innerHTML = `
                    <div class="page-header">
                        <span>Sahifa ${index + 1}</span>
                    </div>
                    <div class="image-wrapper">
                        <img src="${page.src}" style="transform: rotate(${page.rotation}deg);" alt="Sahifa">
                    </div>
                    <div class="tools-bar">
                        <button class="tool-btn" onclick="rotateImage(${index})">🔄 Burish</button>
                        <button class="tool-btn danger" onclick="deletePage(${index})">🗑️ O'chirish</button>
                    </div>
                    <input type="text" class="text-input" placeholder="Ushbu sahifaga matn yozish..." value="${page.text}" oninput="updateText(${index}, this.value)">
                `;
                container.appendChild(card);
            });
        }

        function rotateImage(index) {
            pages[index].rotation = (pages[index].rotation + 90) % 360;
            renderPages();
        }

        function deletePage(index) {
            pages.splice(index, 1);
            renderPages();
        }

        function updateText(index, val) {
            pages[index].text = val;
        }

        function uploadNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pages.push({
                        id: Date.now(),
                        src: e.target.result,
                        text: "",
                        rotation: 0
                    });
                    renderPages();
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                };
                reader.readAsDataURL(file);
            }
        }

        function submitPdf() {
            if (pages.length === 0) {
                alert("Iltimos, kamida bitta rasm qo'shing!");
                return;
            }

            const fileName = document.getElementById('pdfFileName').value || "hujjat.pdf";
            
            // Telegram botga ma'lumot yuborish
            tg.sendData(JSON.stringify({
                action: "create_pdf",
                fileName: fileName,
                pages: pages
            }));
            
            tg.close();
        }

        renderPages();
    </script>
</body>
</html>
