<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f2f5; padding: 12px; padding-bottom: 90px; color: #222; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h3 { font-size: 18px; color: #2c3e50; }
        #pagesContainer { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .page-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .page-header { font-weight: bold; font-size: 13px; color: #555; margin-bottom: 8px; }
        .image-wrapper { width: 100%; height: 220px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 8px; }
        .image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .tools-bar { display: flex; gap: 6px; margin-bottom: 8px; }
        .tool-btn { background: #f0f2f5; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; flex: 1; text-align: center; }
        .tool-btn.danger { background: #ffebee; color: #d32f2f; }
        .text-input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.08); border-top-left-radius: 16px; border-top-right-radius: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .footer-row { display: flex; gap: 8px; align-items: center; }
        .footer-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
        .add-file-btn { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; }
        .save-pdf-btn { background: #229ed9; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; width: 100%; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h3>📄 PDF Tahrirlovchi</h3>
    </div>

    <div id="pagesContainer"></div>

    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="uploadNewImage(event)">

    <div class="footer-panel">
        <div class="footer-row">
            <input type="text" id="pdfFileName" value="hujjat.pdf" placeholder="Fayl nomi...">
            <button class="add-file-btn" onclick="document.getElementById('fileInput').click()">+ Rasm</button>
        </div>
        <button class="save-pdf-btn" onclick="submitPdf()">📥 PDF Yaratish va Yuborish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let pages = [];

        function renderPages() {
            const container = document.getElementById('pagesContainer');
            container.innerHTML = '';

            if (pages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#777; padding: 30px; background:#fff; border-radius:12px;">Hozircha rasmlar yo\'q.<br><br><b>"+ Rasm"</b> tugmasini bosib qo\'shing!</div>';
                return;
            }

            pages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'page-card';
                card.innerHTML = `
                    <div class="page-header">Sahifa ${index + 1}</div>
                    <div class="image-wrapper">
                        <img src="${page.src}" style="transform: rotate(${page.rotation}deg);" alt="Sahifa">
                    </div>
                    <div class="tools-bar">
                        <button class="tool-btn" onclick="rotateImage(${index})">🔄 Burish</button>
                        <button class="tool-btn danger" onclick="deletePage(${index})">🗑️ O'chirish</button>
                    </div>
                    <input type="text" class="text-input" placeholder="Matn yozish..." value="${page.text}" oninput="pages[${index}].text=this.value">
                `;
                container.appendChild(card);
            });
        }

        function rotateImage(index) {
            pages[index].rotation = (pages[index].rotation + 90) % 360;
            renderPages();
        }

        function deletePage(index) {
            pages.splice(index, 1);
            renderPages();
        }

        function uploadNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        
                        // Hajmini maqbul darajaga keltirish (server qotib qolmasligi uchun)
                        const MAX_WIDTH = 1000;
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        pages.push({
                            src: canvas.toDataURL('image/jpeg', 0.8),
                            text: "",
                            rotation: 0
                        });
                        renderPages();
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function submitPdf() {
            if (pages.length === 0) {
                alert("Iltimos, kamida bitta rasm qo'shing!");
                return;
            }

            const fileName = document.getElementById('pdfFileName').value || "hujjat.pdf";
            
            tg.sendData(JSON.stringify({
                fileName: fileName,
                pages: pages
            }));
            
            tg.close();
        }

        renderPages();
    </script>
</body>
</html>
